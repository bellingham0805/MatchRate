<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MatchRate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:700px;margin:auto;min-height:100vh;padding-bottom:82px}
header{padding:28px 18px 14px;position:sticky;top:0;background:rgba(8,11,16,.94);backdrop-filter:blur(12px);z-index:5}
.brand{font-size:28px;font-weight:800}.muted{color:#8d96a3}.sub{font-size:13px;margin-top:4px}
main{padding:10px 16px}.card{background:#11161e;border:1px solid #202733;border-radius:18px;padding:16px;margin:12px 0}
.hero{display:flex;justify-content:space-between;align-items:center}.big{font-size:38px;font-weight:850}.label{font-size:12px;color:#8d96a3;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d1219;border-radius:14px;padding:14px}.stat b{font-size:22px}
button{border:0;border-radius:13px;padding:13px 15px;background:#e9eef5;color:#080b10;font-weight:750;font-size:15px}button.secondary{background:#202733;color:#f5f7fa}button.danger{background:#391c22;color:#ffb8c0}
.row{display:flex;gap:9px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,select,textarea{width:100%;background:#0b1017;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:12px;font-size:16px;margin-top:6px}textarea{min-height:80px}
.field{margin:12px 0}.field label{font-size:13px;color:#aeb6c2}.rating{font-size:28px;font-weight:850}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,12,17,.96);border-top:1px solid #222a35;display:flex;justify-content:center;z-index:10}.nav-inner{width:min(700px,100%);display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;color:#8f99a7;border-radius:0;padding:11px 4px;font-size:12px}.nav button.active{color:#fff}
.list{display:flex;flex-direction:column;gap:8px}.item{background:#0d1219;border-radius:13px;padding:13px}.pill{display:inline-block;background:#202733;border-radius:999px;padding:5px 8px;font-size:11px;color:#cbd3dd}
.empty{text-align:center;padding:45px 15px;color:#8d96a3}.small{font-size:12px;color:#8d96a3}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">MatchRate ⚽</div><div class="sub muted">Your personal football rating database</div></header>
<main id="main"></main>
<nav class="nav"><div class="nav-inner">
<button onclick="go('home')" id="n-home">⌂<br>Home</button>
<button onclick="go('matches')" id="n-matches">▤<br>Matches</button>
<button onclick="go('players')" id="n-players">★<br>Players</button>
<button onclick="go('rate')" id="n-rate">＋<br>Rate</button>
</div></nav>
</div>
<script>
const KEY="matchrate_v1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"matches":[]}');
let page="home";
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function avg(a){return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):"—"}
function go(p){page=p;render()}
function render(){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
let n=document.getElementById("n-"+page); if(n)n.classList.add("active");
const m=document.getElementById("main");
if(page==="home")home(m); if(page==="matches")matches(m); if(page==="players")players(m); if(page==="rate")rate(m);
}
function allPlayers(){let a=[];data.matches.forEach(x=>x.players.forEach(p=>a.push({...p,team:p.team||"—",match:x.home+" vs "+x.away,date:x.date})));return a}
function home(m){
let ps=allPlayers(), best=ps.sort((a,b)=>b.rating-a.rating)[0], ar=ps.map(x=>x.rating);
m.innerHTML=`<div class="card"><div class="hero"><div><div class="label">Matches rated</div><div class="big">${data.matches.length}</div></div><div style="text-align:right"><div class="label">Player ratings</div><div class="big">${ps.length}</div></div></div></div>
<div class="grid"><div class="stat"><div class="label">Average rating</div><b>${avg(ar)}</b></div><div class="stat"><div class="label">Top rating</div><b>${best?best.rating.toFixed(1):"—"}</b></div></div>
<div class="card"><div class="between"><h3 style="margin:0">Highest rated</h3><span class="pill">${best?esc(best.name):"No ratings yet"}</span></div>
${best?`<p style="margin-bottom:0">${esc(best.team)} · ${esc(best.match)}</p>`:`<div class="empty">Rate your first match to start your rankings.</div>`}</div>
<div class="card"><h3>Quick start</h3><p class="muted">After a game, enter the teams, match rating, and the players you want to rate. Everything is saved on this device.</p><button onclick="go('rate')">Rate a match</button></div>`;
}
function rate(m){
m.innerHTML=`<div class="card"><h2>Rate a match</h2>
<div class="field"><label>Competition</label><input id="comp" placeholder="Premier League, Champions League..."></div>
<div class="grid"><div class="field"><label>Home team</label><input id="home" placeholder="Liverpool"></div><div class="field"><label>Away team</label><input id="away" placeholder="Chelsea"></div></div>
<div class="grid"><div class="field"><label>Home score</label><input id="hs" type="number" min="0" value="0"></div><div class="field"><label>Away score</label><input id="as" type="number" min="0" value="0"></div></div>
<div class="field"><label>Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Overall match rating (1–10)</label><input id="mr" type="number" min="1" max="10" step=".1" value="7"></div>
<div class="field"><label>Notes</label><textarea id="notes" placeholder="What stood out?"></textarea></div>
<h3>Players</h3><p class="small">Add the players you want to rate. You can add as many as you watched.</p>
<div id="playerRows"></div><button class="secondary" onclick="addPlayer()">＋ Add player</button>
<div style="margin-top:18px"><button onclick="saveMatch()">Save match</button></div></div>`;
addPlayer();addPlayer();
}
let pc=0;
function addPlayer(){
pc++;let d=document.createElement("div");d.className="item";d.style.marginBottom="8px";d.id="pr"+pc;
d.innerHTML=`<div class="grid"><div><label class="small">Player</label><input class="pn" placeholder="Player name"></div><div><label class="small">Team</label><input class="pt" placeholder="Team"></div></div>
<div class="grid"><div><label class="small">Rating</label><input class="pv" type="number" min="1" max="10" step=".1" value="7"></div><div><label class="small">Goals</label><input class="pg" type="number" min="0" value="0"></div></div>
<div class="field"><label class="small">Assists</label><input class="pa" type="number" min="0" value="0"></div>`;
document.getElementById("playerRows").appendChild(d);
}
function saveMatch(){
let names=[...document.querySelectorAll(".pn")], players=[];
names.forEach((e,i)=>{let row=e.closest(".item"),name=e.value.trim();if(name)players.push({name,team:row.querySelector(".pt").value.trim(),rating:+row.querySelector(".pv").value||0,goals:+row.querySelector(".pg").value||0,assists:+row.querySelector(".pa").value||0})});
let x={id:Date.now(),comp:document.getElementById("comp").value.trim(),home:document.getElementById("home").value.trim()||"Home",away:document.getElementById("away").value.trim()||"Away",hs:+document.getElementById("hs").value||0,as:+document.getElementById("as").value||0,date:document.getElementById("date").value,mr:+document.getElementById("mr").value||0,notes:document.getElementById("notes").value.trim(),players};
data.matches.unshift(x);save();pc=0;go("matches");
}
function matches(m){
m.innerHTML=`<div class="between"><h2>Matches</h2><button onclick="go('rate')">＋ Rate</button></div>`;
if(!data.matches.length){m.innerHTML+=`<div class="empty">No matches yet.<br>Tap “Rate” to add your first one.</div>`;return}
m.innerHTML+=`<div class="list">${data.matches.map(x=>`<div class="card"><div class="between"><b>${esc(x.home)} ${x.hs}–${x.as} ${esc(x.away)}</b><span class="rating">${x.mr.toFixed(1)}</span></div><div class="small">${esc(x.comp||"Football")} · ${esc(x.date)} · ${x.players.length} players rated</div>${x.notes?`<p class="muted">${esc(x.notes)}</p>`:""}<button class="danger" onclick="delMatch(${x.id})">Delete</button></div>`).join("")}</div>`;
}
function delMatch(id){if(confirm("Delete this match?")){data.matches=data.matches.filter(x=>x.id!==id);save();render()}}
function players(m){
let a=allPlayers(), map={};a.forEach(p=>{let k=p.name.toLowerCase();if(!map[k])map[k]={name:p.name,ratings:[],goals:0,assists:0,team:p.team};map[k].ratings.push(p.rating);map[k].goals+=p.goals;map[k].assists+=p.assists});
let arr=Object.values(map).sort((a,b)=>avg(b.ratings)-avg(a.ratings));
m.innerHTML=`<div class="between"><h2>Player rankings</h2><span class="pill">${arr.length} players</span></div>`;
if(!arr.length){m.innerHTML+=`<div class="empty">Your player rankings will appear here.</div>`;return}
m.innerHTML+=`<div class="list">${arr.map((p,i)=>`<div class="item"><div class="between"><div><b>#${i+1} ${esc(p.name)}</b><div class="small">${esc(p.team)} · ${p.ratings.length} rating${p.ratings.length===1?"":"s"}</div></div><span class="rating">${avg(p.ratings)}</span></div><div class="small" style="margin-top:7px">Goals ${p.goals} · Assists ${p.assists}</div></div>`).join("")}</div>`;
}
render();
</script>
</body>
</html>
