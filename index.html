<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MatchRate</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
button,input,select,textarea{font:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}
header{padding:25px 18px 14px;position:sticky;top:0;background:rgba(8,11,16,.94);backdrop-filter:blur(16px);z-index:20;border-bottom:1px solid rgba(255,255,255,.04)}
.brand{font-size:28px;font-weight:850;letter-spacing:-.5px}.muted,.small{color:#8d96a3}.sub{font-size:13px;margin-top:4px}
main{padding:12px 15px}
.card{background:#11161e;border:1px solid #202733;border-radius:19px;padding:16px;margin:12px 0}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font-size:40px;font-weight:850;letter-spacing:-1px}.label{font-size:11px;color:#8d96a3;text-transform:uppercase;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d1219;border-radius:15px;padding:14px}
.stat b{font-size:23px}
button{border:0;border-radius:13px;padding:12px 15px;background:#e9eef5;color:#080b10;font-weight:750;font-size:15px;cursor:pointer}
button.secondary{background:#202733;color:#f5f7fa}button.danger{background:#391c22;color:#ffb8c0}
button.ghost{background:transparent;color:#aeb6c2;padding:8px}
.row{display:flex;gap:9px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,select,textarea{width:100%;background:#0b1017;color:#fff;border:1px solid #2a3340;border-radius:12px;padding:12px;font-size:16px;margin-top:6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#687587}textarea{min-height:80px}.field{margin:11px 0}.field label{font-size:13px;color:#aeb6c2}
.rating{font-size:28px;font-weight:850}.rating.good{color:#c9f7d2}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,12,17,.97);border-top:1px solid #222a35;display:flex;justify-content:center;z-index:30}
.nav-inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;color:#8f99a7;border-radius:0;padding:10px 4px;font-size:12px}.nav button.active{color:#fff}
.list{display:flex;flex-direction:column;gap:8px}.item{background:#0d1219;border-radius:14px;padding:13px}
.pill{display:inline-block;background:#202733;border-radius:999px;padding:5px 9px;font-size:11px;color:#cbd3dd}
.empty{text-align:center;padding:45px 15px;color:#8d96a3}
.search{margin:10px 0}.search input{margin:0}
.segment{display:flex;background:#0d1219;border-radius:13px;padding:4px;margin:12px 0}
.segment button{flex:1;background:transparent;color:#8d96a3;padding:9px;font-size:13px}
.segment button.active{background:#202733;color:#fff}
.match-card{cursor:pointer;transition:.15s}.match-card:active{transform:scale(.99)}
.score{font-size:24px;font-weight:850;letter-spacing:.5px}.teams{font-weight:750}
.player-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.badge{font-size:10px;padding:4px 7px;border-radius:7px;background:#202733;color:#aeb6c2}
.divider{height:1px;background:#202733;margin:14px 0}
.back{margin-bottom:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:min(760px,100%);max-height:88vh;overflow:auto;background:#11161e;border:1px solid #28313d;border-radius:24px 24px 0 0;padding:18px}
.close{float:right;border-radius:50%;width:38px;height:38px;padding:0;background:#202733;color:#fff}
.hidden{display:none}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.big{font-size:35px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">MatchRate ⚽</div>
<div class="sub muted">Your personal football rating database</div>
</header>
<main id="main"></main>
<nav class="nav"><div class="nav-inner">
<button onclick="go('home')" id="n-home">⌂<br>Home</button>
<button onclick="go('matches')" id="n-matches">▤<br>Matches</button>
<button onclick="go('players')" id="n-players">★<br>Players</button>
<button onclick="go('rate')" id="n-rate">＋<br>Rate</button>
</div></nav>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()">
<div class="sheet" id="sheet"></div>
</div>

<script>
const KEY="matchrate_v2";
let old=JSON.parse(localStorage.getItem("matchrate_v1")||'{"matches":[]}');
let data=JSON.parse(localStorage.getItem(KEY)||"null")||old;
data.matches=(data.matches||[]).map(x=>({...x,players:(x.players||[]).map(p=>({...p,starter:p.starter!==false,position:p.position||""}))}));
let page="home", pc=0, playerSearch="", matchFilter="all";

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function avg(a){return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):"—"}
function go(p){page=p;render()}
function allPlayers(){
let a=[];
data.matches.forEach(x=>x.players.forEach(p=>a.push({...p,team:p.team||"—",match:x.home+" vs "+x.away,date:x.date,matchId:x.id})));
return a;
}
function render(){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
let n=document.getElementById("n-"+page);if(n)n.classList.add("active");
const m=document.getElementById("main");
if(page==="home")home(m);
if(page==="matches")matches(m);
if(page==="players")players(m);
if(page==="rate")rate(m);
}

function home(m){
let ps=allPlayers(), ar=ps.map(x=>x.rating), best=ps.length?[...ps].sort((a,b)=>b.rating-a.rating)[0]:null;
let recent=data.matches.slice(0,3);
m.innerHTML=`
<div class="card"><div class="hero">
<div><div class="label">Matches rated</div><div class="big">${data.matches.length}</div></div>
<div style="text-align:right"><div class="label">Player ratings</div><div class="big">${ps.length}</div></div>
</div></div>
<div class="grid">
<div class="stat"><div class="label">Average rating</div><b>${avg(ar)}</b></div>
<div class="stat"><div class="label">Top rating</div><b>${best?best.rating.toFixed(1):"—"}</b></div>
</div>
<div class="card"><div class="between"><h3 style="margin:0">Your top player</h3><span class="pill">${best?esc(best.name):"No ratings yet"}</span></div>
${best?`<p class="muted">${esc(best.team)} · ${best.rating.toFixed(1)} in ${esc(best.match)}</p><button class="secondary" onclick="openPlayer('${esc(best.name).replace(/'/g,"&#39;")}')">View profile</button>`:`<div class="empty">Rate your first match to start your rankings.</div>`}</div>
${recent.length?`<div class="card"><div class="between"><h3 style="margin:0">Recent matches</h3><button class="ghost" onclick="go('matches')">See all</button></div>${recent.map(matchMini).join("")}</div>`:""}
<div class="card"><h3 style="margin-top:0">Quick start</h3><p class="muted">Rate a match, add your Starting XI and substitutes, then build your personal player rankings.</p><button onclick="go('rate')">＋ Rate a match</button></div>`;
}

function matchMini(x){
return `<div class="item match-card" onclick="openMatch(${x.id})">
<div class="between"><div class="teams">${esc(x.home)} vs ${esc(x.away)}</div><span class="rating">${(+x.mr||0).toFixed(1)}</span></div>
<div class="small" style="margin-top:5px">${x.hs}–${x.as} · ${esc(x.comp||"Football")} · ${esc(x.date)}</div></div>`;
}

function rate(m){
m.innerHTML=`<div class="card"><div class="between"><div><h2 style="margin:0">Rate a match</h2><div class="small">Build your match record</div></div></div>
<div class="field"><label>Competition</label><input id="comp" placeholder="Premier League, Champions League..."></div>
<div class="grid"><div class="field"><label>Home team</label><input id="home" placeholder="Liverpool"></div><div class="field"><label>Away team</label><input id="away" placeholder="Chelsea"></div></div>
<div class="grid"><div class="field"><label>Home score</label><input id="hs" type="number" min="0" value="0"></div><div class="field"><label>Away score</label><input id="as" type="number" min="0" value="0"></div></div>
<div class="field"><label>Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Overall match rating (1–10)</label><input id="mr" type="number" min="1" max="10" step=".1" value="7"></div>
<div class="field"><label>Notes</label><textarea id="notes" placeholder="What stood out?"></textarea></div>
<div class="divider"></div>
<div class="between"><h3 style="margin:0">Players</h3><span class="pill">Starting XI + subs</span></div>
<p class="small">Add the players you watched. Mark whether they started, choose a position, and record your rating, goals and assists.</p>
<div id="playerRows"></div><button class="secondary" onclick="addPlayer()">＋ Add player</button>
<div style="margin-top:18px"><button onclick="saveMatch()">Save match</button></div></div>`;
addPlayer();addPlayer();addPlayer();
}

function addPlayer(){
pc++;
let d=document.createElement("div");
d.className="item";
d.style.marginBottom="8px";
d.id="pr"+pc;
d.innerHTML=`<div class="grid">
<div><label class="small">Player</label><input class="pn" placeholder="Player name"></div>
<div><label class="small">Team</label><input class="pt" placeholder="Team"></div></div>
<div class="grid"><div><label class="small">Position</label><select class="pp"><option value="">Position</option><option>GK</option><option>CB</option><option>LB</option><option>RB</option><option>CM</option><option>DM</option><option>AM</option><option>LW</option><option>RW</option><option>ST</option></select></div>
<div><label class="small">Status</label><select class="ps"><option value="starter">Starting XI</option><option value="sub">Substitute</option></select></div></div>
<div class="grid"><div><label class="small">Rating</label><input class="pv" type="number" min="1" max="10" step=".1" value="7"></div>
<div><label class="small">Goals</label><input class="pg" type="number" min="0" value="0"></div></div>
<div class="field"><label class="small">Assists</label><input class="pa" type="number" min="0" value="0"></div>`;
document.getElementById("playerRows").appendChild(d);
}

function saveMatch(){
let players=[];
document.querySelectorAll(".pn").forEach(e=>{
let row=e.closest(".item"),name=e.value.trim();
if(!name)return;
players.push({
name,
team:row.querySelector(".pt").value.trim(),
position:row.querySelector(".pp").value,
starter:row.querySelector(".ps").value==="starter",
rating:+row.querySelector(".pv").value||0,
goals:+row.querySelector(".pg").value||0,
assists:+row.querySelector(".pa").value||0
});
});
let x={
id:Date.now(),
comp:document.getElementById("comp").value.trim(),
home:document.getElementById("home").value.trim()||"Home",
away:document.getElementById("away").value.trim()||"Away",
hs:+document.getElementById("hs").value||0,
as:+document.getElementById("as").value||0,
date:document.getElementById("date").value,
mr:+document.getElementById("mr").value||0,
notes:document.getElementById("notes").value.trim(),
players
};
data.matches.unshift(x);
save();
pc=0;
go("matches");
}

function matches(m){
let filtered=data.matches.filter(x=>{
if(matchFilter==="all")return true;
return (x.comp||"Football").toLowerCase().includes(matchFilter.toLowerCase());
});
m.innerHTML=`<div class="between"><div><h2 style="margin:0">Matches</h2><div class="small">${data.matches.length} total</div></div><button onclick="go('rate')">＋ Rate</button></div>
<div class="segment">
<button class="${matchFilter==="all"?"active":""}" onclick="setMatchFilter('all')">All</button>
<button class="${matchFilter==="Premier"?"active":""}" onclick="setMatchFilter('Premier')">Premier League</button>
<button class="${matchFilter==="Champions"?"active":""}" onclick="setMatchFilter('Champions')">Champions League</button>
</div>`;
if(!filtered.length){
m.innerHTML+=`<div class="empty">No matches found.</div>`;
return;
}
m.innerHTML+=`<div class="list">${filtered.map(x=>`<div class="card match-card" onclick="openMatch(${x.id})">
<div class="between"><div><div class="teams">${esc(x.home)} ${x.hs}–${x.as} ${esc(x.away)}</div><div class="small" style="margin-top:5px">${esc(x.comp||"Football")} · ${esc(x.date)}</div></div><span class="rating">${(+x.mr||0).toFixed(1)}</span></div>
<div class="small" style="margin-top:10px">${x.players.length} player${x.players.length===1?"":"s"} rated · Tap for full match</div></div>`).join("")}</div>`;
}

function setMatchFilter(x){matchFilter=x;render()}

function players(m){
let a=allPlayers(),map={};
a.forEach(p=>{
let k=p.name.toLowerCase();
if(!map[k])map[k]={name:p.name,ratings:[],goals:0,assists:0,team:p.team};
map[k].ratings.push(p.rating);
map[k].goals+=p.goals;
map[k].assists+=p.assists;
});
let arr=Object.values(map).sort((a,b)=>Number(avg(b.ratings))-Number(avg(a.ratings)));
let q=playerSearch.toLowerCase();
if(q)arr=arr.filter(p=>p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q));
m.innerHTML=`<div class="between"><div><h2 style="margin:0">Player rankings</h2><div class="small">${Object.keys(map).length} players tracked</div></div></div>
<div class="search"><input value="${esc(playerSearch)}" oninput="playerSearch=this.value;players(document.getElementById('main'))" placeholder="Search player or team"></div>`;
if(!arr.length){
m.innerHTML+=`<div class="empty">No players found.</div>`;
return;
}
m.innerHTML+=`<div class="list">${arr.map((p,i)=>`<div class="item match-card" onclick="openPlayer('${esc(p.name).replace(/'/g,"&#39;")}')">
<div class="player-line"><div><b>#${i+1} ${esc(p.name)}</b><div class="small">${esc(p.team)} · ${p.ratings.length} rating${p.ratings.length===1?"":"s"}</div></div><span class="rating">${avg(p.ratings)}</span></div>
<div class="small" style="margin-top:8px">Goals ${p.goals} · Assists ${p.assists}</div></div>`).join("")}</div>`;
}

function openMatch(id){
let x=data.matches.find(z=>z.id===id);
if(!x)return;
let starters=x.players.filter(p=>p.starter),subs=x.players.filter(p=>!p.starter);
document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button>
<h2 style="margin:3px 48px 3px 0">${esc(x.home)} ${x.hs}–${x.as} ${esc(x.away)}</h2>
<div class="small">${esc(x.comp||"Football")} · ${esc(x.date)}</div>
<div class="card" style="margin-top:16px"><div class="label">Your match rating</div><div class="big">${(+x.mr||0).toFixed(1)}</div>${x.notes?`<p class="muted">${esc(x.notes)}</p>`:""}</div>
<h3>Starting XI</h3>${playerList(starters)}
${subs.length?`<h3 style="margin-top:20px">Substitutes</h3>${playerList(subs)}`:""}
<div style="margin-top:18px"><button class="danger" onclick="delMatch(${x.id});closeModal()">Delete match</button></div>`;
showModal();
}

function playerList(list){
if(!list.length)return `<div class="empty" style="padding:20px">None recorded.</div>`;
return `<div class="list">${list.map(p=>`<div class="item"><div class="between"><div><b>${esc(p.name)}</b><div class="small">${esc(p.team||"")} ${p.position?"· "+esc(p.position):""}</div></div><span class="rating">${(+p.rating||0).toFixed(1)}</span></div><div class="small" style="margin-top:7px">⚽ ${p.goals||0} · Assists ${p.assists||0}</div></div>`).join("")}</div>`;
}

function openPlayer(name){
let a=allPlayers().filter(p=>p.name.toLowerCase()===name.toLowerCase());
if(!a.length)return;
let ratings=a.map(p=>p.rating),best=Math.max(...ratings),worst=Math.min(...ratings);
document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button>
<h2 style="margin:3px 48px 3px 0">${esc(a[0].name)}</h2><div class="small">${esc(a[0].team)}</div>
<div class="grid" style="margin-top:16px"><div class="stat"><div class="label">Average</div><b>${avg(ratings)}</b></div><div class="stat"><div class="label">Matches</div><b>${a.length}</b></div>
<div class="stat"><div class="label">Highest</div><b>${best.toFixed(1)}</b></div><div class="stat"><div class="label">Lowest</div><b>${worst.toFixed(1)}</b></div></div>
<h3>Rating history</h3>${a.slice().reverse().map(p=>`<div class="item" style="margin:7px 0"><div class="between"><div><b>${esc(p.match)}</b><div class="small">${esc(p.date)} · ${p.starter?"Starting XI":"Substitute"}</div></div><span class="rating">${(+p.rating||0).toFixed(1)}</span></div></div>`).join("")}`;
showModal();
}

function showModal(){
document.getElementById("modal").classList.remove("hidden");
document.body.style.overflow="hidden";
}

function closeModal(){
document.getElementById("modal").classList.add("hidden");
document.body.style.overflow="";
}

function delMatch(id){
if(confirm("Delete this match?")){
data.matches=data.matches.filter(x=>x.id!==id);
save();
render();
}
}

render();
</script>
</body>
</html>
